name: CI Build

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Siv3D SDK
        run: |
          curl -L https://github.com/Siv3D/OpenSiv3D/archive/refs/tags/v0.6.16.zip -o siv3d-sdk.zip
          Expand-Archive -Path siv3d-sdk.zip -DestinationPath sdk
          # ネストされたフォルダをリネームして揃える
          mv sdk/OpenSiv3D-0.6.16/OpenSiv3D-0.6.16 sdk/siv3d
          echo "SIV3D_0_6_16=$PWD/sdk/siv3d" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: |
          msbuild "Siv3DGameJam2025Project.sln" `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }}
        shell: pwsh
