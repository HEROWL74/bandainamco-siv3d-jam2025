name: CI Build

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OpenSiv3D v0.6.16
        shell: pwsh
        run: |
          curl -L https://github.com/Siv3D/OpenSiv3D/archive/refs/tags/v0.6.16.zip -o siv3d-sdk.zip
          New-Item -ItemType Directory -Force -Path sdk | Out-Null
          Expand-Archive -Path siv3d-sdk.zip -DestinationPath sdk -Force

          $sdkRoot = (Resolve-Path 'sdk\OpenSiv3D-0.6.16').Path
          "SIV3D_0_6_16=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SIV3D_0_6_16=$sdkRoot"

          if (-not (Test-Path "$sdkRoot\Siv3D\include\Siv3D.hpp")) {
            Write-Host "---- DIR LIST (sdkRoot) ----"
            Get-ChildItem -Recurse -Path $sdkRoot | Select-Object FullName
            throw "Siv3D.hpp not found at $sdkRoot\Siv3D\include\Siv3D.hpp"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          msbuild "Siv3DGameJam2025Project.sln" `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }}
