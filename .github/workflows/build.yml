name: CI Build

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Siv3D SDK
        run: |
          curl -L https://github.com/Siv3D/OpenSiv3D/archive/refs/tags/v0.6.16.zip -o siv3d-sdk.zip
          powershell -Command "Expand-Archive -Path siv3d-sdk.zip -DestinationPath sdk"
          echo "SIV3D_0_6_16=$PWD\sdk\OpenSiv3D-0.6.16" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: |
          msbuild Siv3DGameJam2025Project.sln `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:AdditionalIncludeDirectories="$env:SIV3D_0_6_16\include;$env:SIV3D_0_6_16\include\ThirdParty" `
            /p:AdditionalLibraryDirectories="$env:SIV3D_0_6_16\lib\Windows"
        shell: pwsh
