name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OpenSiv3D v0.6.16 (Windows SDK)
        shell: pwsh
        run: |
          $url = "https://siv3d.jp/downloads/Siv3D/manual/0.6.16/OpenSiv3D_SDK_0.6.16.zip"
          curl -L $url -o siv3d-sdk.zip
          New-Item -ItemType Directory -Force -Path sdk | Out-Null
          Expand-Archive -Path siv3d-sdk.zip -DestinationPath sdk -Force
          $sdkRoot = (Resolve-Path 'sdk\OpenSiv3D_SDK_0.6.16').Path
          "SIV3D_0_6_16=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clean
        shell: pwsh
        run: |
          if (Test-Path "x64") { Remove-Item -Recurse -Force "x64" }
          if (Test-Path "ReleaseGame.zip") { Remove-Item -Force "ReleaseGame.zip" }
          if (Test-Path "package") { Remove-Item -Recurse -Force "package" }

      - name: Build Release (standard output path)
        shell: pwsh
        run: |
          msbuild "Siv3DGameJam2025Project.sln" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m:1 `
            /t:Clean,Build

      - name: Copy EXE and resources to App folder
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path "x64/Release" -Filter "*.exe" -Recurse
          if ($exeFiles.Count -eq 0) { throw "❌ No .exe found in x64/Release" }

          # Appフォルダ作成
          New-Item -ItemType Directory -Force -Path "App" | Out-Null

          # exeコピー
          foreach ($exe in $exeFiles) {
            Copy-Item -Force $exe.FullName "App/${exe.Name}"
          }

      - name: Prepare Clean Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          $includeList = @("App/*.exe", "App/Assets", "App/Data", "App/Map", "App/icon.ico", "App/Resource.rc")
          foreach ($path in $includeList) {
            if (Test-Path $path) { Copy-Item -Recurse -Force $path package/ }
          }

      - name: Compress to ReleaseGame.zip
        shell: pwsh
        run: |
          Compress-Archive -Path "package/*" -DestinationPath "ReleaseGame.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ReleaseGame.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
