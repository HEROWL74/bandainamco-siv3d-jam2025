name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OpenSiv3D v0.6.16 (Windows SDK)
        shell: pwsh
        run: |
          $url = "https://siv3d.jp/downloads/Siv3D/manual/0.6.16/OpenSiv3D_SDK_0.6.16.zip"
          curl -L $url -o siv3d-sdk.zip
          New-Item -ItemType Directory -Force -Path sdk | Out-Null
          Expand-Archive -Path siv3d-sdk.zip -DestinationPath sdk -Force
          $sdkRoot = (Resolve-Path 'sdk\OpenSiv3D_SDK_0.6.16').Path
          "SIV3D_0_6_16=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clean
        shell: pwsh
        run: |
          if (Test-Path "Intermediate") { Remove-Item -Recurse -Force "Intermediate" }

      - name: Build Release
        shell: pwsh
        run: |
          msbuild "Siv3DGameJam2025Project.sln" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m:1 `
            /t:Clean,Build

      - name: Copy EXE to App folder
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path "Intermediate" -Filter "*.exe" -Recurse
          if ($exeFiles.Count -eq 0) { throw "No exe found under Intermediate/" }
          foreach ($exe in $exeFiles) {
            Copy-Item -Force $exe.FullName "App/${exe.Name}"
          }

      - name: Prepare ReleaseApp Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ReleaseApp | Out-Null
          Copy-Item -Recurse -Force "App" "ReleaseApp/App"

      - name: Compress to ReleaseGame.zip
        shell: pwsh
        run: |
          Push-Location "ReleaseApp/App"
          Compress-Archive -Path "App/*" -DestinationPath "ReleaseGame.zip" -Force
          Pop-Location

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReleaseGame
          path: ReleaseGame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ReleaseGame.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
