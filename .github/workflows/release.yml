name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OpenSiv3D v0.6.16 (Windows SDK)
        shell: pwsh
        run: |
          $url = "https://siv3d.jp/downloads/Siv3D/manual/0.6.16/OpenSiv3D_SDK_0.6.16.zip"
          curl -L $url -o siv3d-sdk.zip
          New-Item -ItemType Directory -Force -Path sdk | Out-Null
          Expand-Archive -Path siv3d-sdk.zip -DestinationPath sdk -Force
          $sdkRoot = (Resolve-Path 'sdk\OpenSiv3D_SDK_0.6.16').Path
          "SIV3D_0_6_16=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clean
        shell: pwsh
        run: |
          if (Test-Path "Intermediate") { Remove-Item -Recurse -Force "Intermediate" }
          if (Test-Path "App") { Remove-Item -Recurse -Force "App" }
          if (Test-Path "package") { Remove-Item -Recurse -Force "package" }
          if (Test-Path "ReleaseGame.zip") { Remove-Item -Force "ReleaseGame.zip" }

      - name: Build Release (Output to App)
        shell: pwsh
        run: |
          msbuild "Siv3DGameJam2025Project.sln" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            '/p:OutDir=App\\' `
            /m:1 `
            /t:Clean,Build

      - name: Clean Debug Files
        shell: pwsh
        run: |
          Get-ChildItem -Path "App" -Include *.pdb,*.obj,*.tlog,*.iobj,*.exp,*.idb -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Prepare Clean Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          $includeList = @("App/*.exe", "App/Assets", "App/Data", "App/Map", "App/icon.ico", "App/Resource.rc")
          foreach ($path in $includeList) {
            if (Test-Path $path) { Copy-Item -Recurse -Force $path package/ }
          }

      - name: Compress to ReleaseGame.zip
        shell: pwsh
        run: |
          Compress-Archive -Path "package/*" -DestinationPath "ReleaseGame.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ReleaseGame.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
