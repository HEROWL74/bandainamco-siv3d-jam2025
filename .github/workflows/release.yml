name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OpenSiv3D v0.6.16 (Windows SDK)
        shell: pwsh
        run: |
          $url = "https://siv3d.jp/downloads/Siv3D/manual/0.6.16/OpenSiv3D_SDK_0.6.16.zip"
          curl -L $url -o siv3d-sdk.zip
          New-Item -ItemType Directory -Force -Path sdk | Out-Null
          Expand-Archive -Path siv3d-sdk.zip -DestinationPath sdk -Force

          $sdkRoot = (Resolve-Path 'sdk\OpenSiv3D_SDK_0.6.16').Path
          "SIV3D_0_6_16=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SIV3D_0_6_16=$sdkRoot"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clean old build directories
        run: |
          if (Test-Path "Intermediate") { Remove-Item -Recurse -Force "Intermediate" }

      - name: Build Release
        shell: pwsh
        run: |
          msbuild "Siv3DGameJam2025Project.sln" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m:1 `
            /t:Clean,Build

      - name: Verify App Folder Exists
        shell: pwsh
        run: |
          if (-not (Test-Path "Siv3DGameJam2025Project/App")) {
            throw "❌ Build did not produce expected App folder: Siv3DGameJam2025Project/App"
          }
          Write-Host "✅ App folder found"

      - name: Prepare Release Artifact
        shell: pwsh
        run: |
          # Appをコピーしてリリース用フォルダを作る
          New-Item -ItemType Directory -Force -Path ReleaseApp | Out-Null
          Copy-Item -Recurse -Force "Siv3DGameJam2025Project/App/*" "ReleaseApp/"

          Write-Host "==== ReleaseApp Folder Structure ===="
          Get-ChildItem -Recurse -Depth 3 ReleaseApp

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Siv3DGameRelease
          path: ReleaseApp

      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          files: ReleaseApp/**
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
